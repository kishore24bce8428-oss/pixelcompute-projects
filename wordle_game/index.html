
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Wordle Game</h1>

        <div id="board"></div>

        <form id="guess-form">
            <input
                type="text"
                id="guess-input"
                maxlength="5"
                placeholder="Enter a word"
                autocomplete="off"
                autofocus
            >

            <button type="submit" id="submit-btn">
                Submit Guess
            </button>
        </form>

        <p id="message"></p>

        <button id="restart-btn" hidden>
            Play Again
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
